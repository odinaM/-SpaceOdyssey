<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Космическая Одиссея - Экономика с нуля</title>
</head>
<body>
     <div class="stars" id="stars"></div>
    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="scan-line"></div>
            <div class="modal-header">
                <div class="modal-title">
                    <span class="robot-big">&#x1F916;</span>
                    <span>ВЫВОД НЕЙРОСЕТИ</span>
                </div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <!-- динамической подгрузкой контента -->
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer">
                <p>Обработка и анализ данных завершён</p>
            </div>
        </div>
    </div>

    <div class="slide">
        <div class="content">
            <div class="level-badge">УРОВЕНЬ 4</div>
            <h2>Средство платежа</h2>

            <div class="situation">
                <h3>Ситуация:</h3>
                <p class="situation_text">
                    Сломался тепловой генератор<br>
                    Денег сейчас нет<br>
                    Деньги появятся через 3 месяца
                </p>
            </div>

            <div class="question">
                Вопрос экипажу:<br>
                Как получить услугу сегодня, а заплатить позже?
            </div>

            <button class="ai-button" onclick="showAI('level4')">
                <span class="robot-icon">&#x1F916;</span>
                <span>Запросить вывод нейросети</span>
            </button>
        </div>
         <div class="btn">
            <a href="level5.html">5 уровень</a>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
